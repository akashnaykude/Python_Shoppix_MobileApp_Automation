[pytest]
python_files = test_*.py *_steps.py
python_functions = test_*
testpaths = Steps
bdd_features_base_dir = Features
addopts = --alluredir=artifacts/allure-results
markers =
    smoke: Core smoke scenarios
    login: Login validation scenarios
    welcome: Welcome screen validation scenarios
    registration: Registration validation scenarios
    waitlist_registration: Waiting list registration scenarios
    slow_backend: Scenarios dependent on backend response latency
    negative: Negative login and validation scenarios
